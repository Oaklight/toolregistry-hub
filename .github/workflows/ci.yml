name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies for ty
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://test.pypi.org/simple/ --prefer-binary -e ".[dev,server]"

      - name: Run pre-commit checks
        uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://test.pypi.org/simple/ --prefer-binary -e ".[dev,server]"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  # The dependency floor is core 0.21.0, the first release with
  # ``@tool_metadata``.  This job installs core master, which is ahead of that
  # floor, and runs the registry tests against it.  A failure here means the
  # next core release would break the Hub preset or its declarations.
  test-core-master:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          # bashtool is a git submodule; without it, the Hub package cannot be
          # imported and every test module fails at collection.
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies with core master
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://test.pypi.org/simple/ --prefer-binary -e ".[dev,server_core]"
          pip install --force-reinstall --no-deps "toolregistry @ git+https://github.com/Oaklight/ToolRegistry@master"
          python -c "import importlib.metadata as m; print('toolregistry', m.version('toolregistry'))"

      - name: Run registry tests
        run: python -m pytest tests/test_registry.py -q

  # The floor is server 0.9.0 and core 0.21.0 (published as prereleases on
  # TestPyPI).  This job installs those exact wheels so the launcher path is
  # exercised the way a user gets it, and pins them again on the extras
  # install so a later TestPyPI prerelease cannot replace the wheels under
  # test.  The core pin is required because pip prefers the final 0.21.0 over
  # the dev1 build this job needs.  TestPyPI does not host the dependencies,
  # so the PyPI extra index is mandatory.
  test-server-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install the server prerelease from TestPyPI
        run: |
          python -m pip install --upgrade pip
          pip install --pre --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ "toolregistry-server==0.9.0.dev1"

      - name: Install the Hub and test dependencies
        run: |
          pip install --extra-index-url https://test.pypi.org/simple/ --prefer-binary -e ".[dev,server]" "toolregistry-server==0.9.0.dev1" "toolregistry==0.21.0.dev1"
          python -c "import importlib.metadata as m; print('toolregistry', m.version('toolregistry')); print('toolregistry-server', m.version('toolregistry-server'))"

      - name: Run launcher and metadata tests
        run: >
          python -m pytest
          tests/test_server_launcher.py
          tests/test_registry.py
          tests/test_output_schemas.py
          tests/test_cli_dispatch.py
          -q

  # Canary against server master, which is ahead of the released floor.  A
  # failure here means an unreleased server change would break the launcher
  # and must be coordinated before the next server release.
  test-server-master:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies with server master
        run: |
          python -m pip install --upgrade pip
          # The launcher tests build a gateway, so the OpenAPI/MCP extras are
          # installed; the server package itself comes from master below.
          pip install --extra-index-url https://test.pypi.org/simple/ --prefer-binary -e ".[dev,server]"
          pip install --force-reinstall --no-deps "toolregistry @ git+https://github.com/Oaklight/ToolRegistry@master"
          pip install --force-reinstall --no-deps "toolregistry-server @ git+https://github.com/Oaklight/toolregistry-server@master"
          python -c "import importlib.metadata as m; print('toolregistry', m.version('toolregistry')); print('toolregistry-server', m.version('toolregistry-server'))"

      - name: Run launcher tests
        run: python -m pytest tests/test_server_launcher.py -q
